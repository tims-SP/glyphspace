  case 'ArrowRight':next=Math.min(row.length-1,i+1);break;
  case 'ArrowLeft':next=Math.max(0,i-1);break;
  case 'Home':next=0;break;
  case 'End':next=row.length-1;break;
  case 'PageDown':next=Math.min(row.length-1,(Math.floor(i/5)+1)*5);break;
  case 'PageUp':next=Math.max(0,(Math.floor(i/5)-1)*5);break;
  default:return;
 }
 e.preventDefault();e.stopPropagation();
 focusKey(row[next]);
 const target=[...document.querySelectorAll('#lensKeys39 button[data-lens-key]')].find(b=>b.dataset.lensKey===row[next]);
 if(target)target.focus({preventScroll:true});
});
renderLens39();
