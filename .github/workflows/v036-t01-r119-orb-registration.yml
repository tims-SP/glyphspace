name: V0.36 T01 R119 real cross-source ORB registration (nonimage seed)
on:
  push:
    paths:
      - '.github/workflows/v036-t01-r119-orb-registration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch pinned highres bytes and register to nonimage lowres ORB features
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -m pip install --quiet numpy opencv-python-headless pillow
          python3 - <<'PY'
          import base64,hashlib,io,json,urllib.parse,urllib.request,zipfile,zlib
          import numpy as np,cv2
          from PIL import Image
          seed=""
          packed=base64.b64decode(seed,validate=True)
          assert hashlib.sha256(packed).hexdigest()=="b523bd28b4460193da3d62af5dc131c443df232202ae1be7476c8dc1bd23a1e2"
          raw=zlib.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=="d8eddf97a7d33def7422d4bda841d5ab738a137381d475d55996497babb88b4c"
          assert len(raw)==133*40
          xy=np.frombuffer(raw[:133*8],dtype="<f4").reshape(133,2)
          descriptors=np.frombuffer(raw[133*8:],dtype=np.uint8).reshape(133,32)
          assert np.isfinite(xy).all() and (xy[:,0]>=0).all() and (xy[:,0]<1536).all() and (xy[:,1]>=0).all() and (xy[:,1]<1086).all()
          name="第三代五笔字型（新世纪版）简体字根键位图高清版(官方).zip"
          url="https://raw.githubusercontent.com/06wb/06wb.github.io/master/Tutorials/"+urllib.parse.quote(name)
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"glyphspace-r119-source-registration"}),timeout=60) as resp: blob=resp.read(2000000)
          assert len(blob)==996823 and hashlib.sha256(blob).hexdigest()=="fb7a9984a84be12a71d71dc86088b8859762ca97cb9a3db173b4a8adaf0b9707"
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
            assert z.namelist()==["zgjwt_jt_3508x2480.jpg"]
            info=z.infolist()[0]
            assert info.file_size==1348865 and info.compress_type==zipfile.ZIP_DEFLATED
            jpeg=z.read(info)
          assert hashlib.sha256(jpeg).hexdigest()=="47c5d53f6cf57ac67c957c6510a3e2696072c3ce63e73024ed025367f31c600e"
          image=Image.open(io.BytesIO(jpeg)).convert("L")
          assert image.size==(3508,2480)
          scaled=cv2.resize(np.asarray(image),(1536,1086),interpolation=cv2.INTER_AREA)
          orb=cv2.ORB_create(nfeatures=4000,scaleFactor=1.2,nlevels=8,edgeThreshold=19,fastThreshold=9)
          kp,hd=orb.detectAndCompute(scaled,None)
          assert hd is not None
          matches=cv2.BFMatcher(cv2.NORM_HAMMING).knnMatch(descriptors,hd,k=2)
          good=[m for m,n in matches if m.distance<.78*n.distance and m.distance<=64]
          print("R119_RATIO_MATCHES="+str(len(good)))
          assert len(good)>=22, "weak cross-source matches"
          src=np.float32([xy[m.queryIdx] for m in good]);dst=np.float32([kp[m.trainIdx].pt for m in good])
          mat,mask=cv2.estimateAffine2D(src,dst,method=cv2.RANSAC,ransacReprojThreshold=3,maxIters=9000,confidence=.999,refineIters=50)
          assert mat is not None and mask is not None
          keep=mask.ravel().astype(bool);pts=src[keep];target=dst[keep]
          res=np.linalg.norm(pts@mat[:,:2].T+mat[:,2]-target,axis=1)
          bins={(min(4,int(x/1536*5)),min(4,int(y/1086*5))) for x,y in pts}
          assert len(pts)>=22 and len(pts)/len(good)>=.35
          assert len(bins)>=8 and np.median(res)<=2 and np.percentile(res,95)<=5
          assert np.linalg.norm(mat[:,:2]-np.eye(2))<.2 and max(abs(mat[0,2]),abs(mat[1,2]))<70
          native=np.diag([3508/1536,2480/1086])@mat
          boxes={"M-vis-02":(1045,585,21,23),"M-vis-07":(1027,653,12,14),"M-vis-08":(1040,653,12,15),"K:2/K:3":(1066,461,21,24),"E:1/E:8":(452,223,16,23)}
          def project(box):
            x,y,w,h=box
            pts=np.array([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],dtype=float)
            out=pts@native[:,:2].T+native[:,2]
            return [round(float(out[:,0].min()),3),round(float(out[:,1].min()),3),round(float(out[:,0].max()),3),round(float(out[:,1].max()),3)]
          report={"status":"pass","source2008SHA256":"df5eb1a8678eea5ae27b3bfbc6bcef17af8b8ef558696834214dcdffa86dcd49","highresSHA256":hashlib.sha256(jpeg).hexdigest(),"sourceFeatureCount":133,"candidateFeatures":len(kp),"ratioMatches":len(good),"ransacInliers":int(keep.sum()),"spatialBins":len(bins),"medianResidualLowPixels":round(float(np.median(res)),4),"p95ResidualLowPixels":round(float(np.percentile(res,95)),4),"affineLowToNativeHighres":native.round(7).tolist(),"riskBoxesHighresNative":{k:project(v) for k,v in boxes.items()},"license":"unconfirmed","certifiedKeys":0,"approvedCrop":False,"permanentIDs":0,"formalAccepted":False}
          print("R119_CROSS_SOURCE="+json.dumps(report,sort_keys=True,separators=(",",":")))
          # The two JPEGs are never written to disk or uploaded; only numerical evidence is emitted.
          PY
