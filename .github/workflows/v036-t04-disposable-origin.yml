name: V0.36 T04 disposable-origin browser QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v036-t04-disposable-origin.yml'
      - 'scripts/qa_v036_t04_disposable_origin.py'
      - 'scripts/qa_v036_t04_r149_strict_origin.py'
      - 'scripts/v036_r148_strict_shadow.js'
      - 'scripts/v036_r150_alias_plan.js'
      - 'scripts/qa_v036_t04_r150_alias_origin.py'
      - 'scripts/v036_r151_issued_plan.js'
      - 'scripts/qa_v036_t04_r151_issued_origin.py'

permissions:
  contents: read

jobs:
  real-origin-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Chromium dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Real Web Locks, localStorage, and fail-closed rollback on disposable origin
        run: python scripts/qa_v036_t04_disposable_origin.py
      - name: R149 strict legacy v16 source reader on disposable real origin
        run: python scripts/qa_v036_t04_r149_strict_origin.py
      - name: R150 immutable legacy alias shadow plan on disposable real origin
        run: python scripts/qa_v036_t04_r150_alias_origin.py
      - name: R151 issuer-bound plan on disposable real origin
        run: python scripts/qa_v036_t04_r151_issued_origin.py
      - name: Preserve disposable-origin QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v036-t04-disposable-origin-results
          path: |
            t04_disposable_origin_results.json
            t04_r149_strict_origin_results.json
            t04_r150_alias_origin_results.json
            t04_r151_issued_origin_results.json
          if-no-files-found: warn
          retention-days: 14
