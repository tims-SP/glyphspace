name: V0.36 T01 R117 strict M highres seam (source-only)
on:
  push:
    paths:
      - '.github/workflows/v036-t01-highres-edge-interface.yml'
      - 'scripts/v036_t01_edge_interface.py'
      - 'scripts/v036_t01_source_topology.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed highres source bytes and strict boundary evidence
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          PYTHONPATH=scripts python3 - <<'PY'
          import hashlib,io,json,urllib.parse,urllib.request,zipfile
          from PIL import Image
          from v036_t01_edge_interface import audit,seam
          def sha(x):return hashlib.sha256(x).hexdigest()
          synthetic=Image.new('L',(20,20),255)
          p=synthetic.load();p[9,10]=0;p[10,11]=0
          assert seam(synthetic,(2,5,10,15),(10,5,18,15),160)['contacts']==1
          p[10,11]=255
          assert seam(synthetic,(2,5,10,15),(10,5,18,15),160)['contacts']==0
          name='第三代五笔字型（新世纪版）简体字根键位图高清版(官方).zip'
          url='https://raw.githubusercontent.com/06wb/06wb.github.io/master/Tutorials/'+urllib.parse.quote(name)
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'glyphspace-r117-source-seam'}),timeout=60) as resp:blob=resp.read(2000000)
          assert len(blob)==996823 and sha(blob)=='fb7a9984a84be12a71d71dc86088b8859762ca97cb9a3db173b4a8adaf0b9707'
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
            assert z.namelist()==['zgjwt_jt_3508x2480.jpg']
            raw=z.read(z.infolist()[0])
          assert len(raw)==1348865 and sha(raw)=='47c5d53f6cf57ac67c957c6510a3e2696072c3ce63e73024ed025367f31c600e'
          im=Image.open(io.BytesIO(raw)).convert('RGB')
          assert im.size==(3508,2480)
          result=audit(im)
          assert len(result['edge'])==5 and len(result['pairs'])==15
          assert all(0<=x['strictConnectedExtensionInk']<=x['contextConnectedExtensionInk'] for x in result['edge'])
          assert all(x['strictSharedComponents']<=x['contextSharedComponents'] for x in result['pairs'])
          assert result['certifiedKeys']==0 and not result['sourceCertified']
          print('R117_SOURCE_SHA='+sha(raw))
          print('R117_SUMMARY='+json.dumps({'status':'pass','source':'fixed SHA 3508x2480 JPEG','license':'unconfirmed','certifiedKeys':0,'permanentIDs':0,'approvedCrop':False},sort_keys=True))
          for x in result['edge']:print('R117_EDGE='+json.dumps(x,sort_keys=True))
          for x in result['pairs']:print('R117_PAIR='+json.dumps(x,sort_keys=True))
          # Third-party image bytes remain in memory and are never uploaded.
          PY
