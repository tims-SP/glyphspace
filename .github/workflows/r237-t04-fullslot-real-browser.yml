name: R237 T04 25-key 156-slot real same-origin isolated Chromium
on:
  push:
    branches: [main]
    paths:
      - 'scripts/r237_fullslot_real_browser.py'
      - '.github/workflows/r237-t04-fullslot-real-browser.yml'
  workflow_dispatch:
jobs:
  fullslot-real-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real issuer 25-key 156-slot integration
        run: |
          mkdir -p /tmp/glyphspace-r237
          cp scripts/v036_r148_strict_shadow.js scripts/v036_r152_source_bound_plan.js scripts/r194_r178_freshness.js scripts/r194_r179_realm.js scripts/r194_frozen_root_coords.json scripts/r194_real_issuer_r192_bridge.mjs scripts/r192_idempotent_freshness_core.mjs scripts/r237_fullslot_real_browser.py /tmp/glyphspace-r237/
          printf '<!doctype html><meta charset="utf-8"><title>R237 isolated</title>' > /tmp/glyphspace-r237/index.html
          python /tmp/glyphspace-r237/r237_fullslot_real_browser.py
      - name: Upload isolated QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r237-t04-fullslot-real-browser
          path: /tmp/glyphspace-r237/R237_real_browser_QA.json
          if-no-files-found: warn
