name: V0.36 T01 external reference provenance probe
on:
  push:
    paths:
      - '.github/workflows/v036-t01-reference-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe two externally mirrored source archives (metadata only)
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import hashlib,io,json,urllib.request,zipfile
          from PIL import Image
          root='https://raw.githubusercontent.com/06wb/06wb.github.io/master/Tutorials/'
          archives=[
           ('第三代五笔字型（新世纪版）简体字根键位图高清版(官方).zip','fb7a9984a84be12a71d71dc86088b8859762ca97cb9a3db173b4a8adaf0b9707','zgjwt_jt_3508x2480.jpg',3508,2480),
           ('第三代五笔字型（新世纪版）简体、繁体字根键位图(官方).zip','eaad30ee3ee50b54c6631967dcb794ca95503190ae6f3ea3f7ab7f8be16e6179','zgjwt_jf_1479x843.jpg',1479,843)]
          def dhash(im):
           im=im.convert('L').resize((9,8),Image.Resampling.LANCZOS)
           p=list(im.getdata());v=0
           for y in range(8):
            for x in range(8):v=(v<<1)|int(p[y*9+x]>p[y*9+x+1])
           return '%016x'%v
          rows=[]
          for name,expected,entry,w,h in archives:
           url=root+urllib.parse.quote(name)
           with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'glyphspace-v036-source-provenance-audit'}),timeout=45) as resp:
            blob=resp.read(3000000)
           sha=hashlib.sha256(blob).hexdigest()
           assert sha==expected,(name,'archive_sha_mismatch',sha)
           with zipfile.ZipFile(io.BytesIO(blob)) as z:
            assert z.namelist()==[entry],(name,z.namelist())
            raw=z.read(entry)
            with Image.open(io.BytesIO(raw)) as im:
             im.verify()
            with Image.open(io.BytesIO(raw)) as im:
             assert im.size==(w,h),(name,im.size)
             hashes=[dhash(im)]
             for box in [(0,0,.5,.5),(.5,0,1,.5),(0,.5,.5,1),(.5,.5,1,1)]:
              hashes.append(dhash(im.crop(tuple(round(v*im.size[i%2]) for i,v in enumerate(box)))))
           rows.append({'archive':name,'archiveBytes':len(blob),'archiveSHA256':sha,'entry':entry,'jpegBytes':len(raw),'jpegSHA256':hashlib.sha256(raw).hexdigest(),'size':[w,h],'dhashGlobalAndQuadrants':hashes,'sourceLicense':'not-established','sameAsFrozen2008Reference':'not-established'})
          print('R114_OFFICIAL_SOURCE_PROBE_JSON='+json.dumps({'result':'pass','source':'06wb community mirror, official-labeled filenames only','archives':rows,'certifiedKeys':0,'approvedIDs':0,'formalAccepted':False},ensure_ascii=False,separators=(',',':')))
          PY
