name: R183 T04 shared disposable transaction core real browser
on:
  push:
    branches: [main]
    paths:
      - 'scripts/r183_disposable_transaction_core.mjs'
      - 'scripts/r183_shared_core_browser.py'
      - '.github/workflows/r183-t04-shared-core-browser.yml'
  workflow_dispatch:
jobs:
  same-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Chromium test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify same ESM module with real Web Locks and localStorage
        run: |
          mkdir -p /tmp/glyphspace-r183-disposable
          cp scripts/r183_disposable_transaction_core.mjs /tmp/glyphspace-r183-disposable/quarantine_transaction_core.mjs
          cp scripts/r183_shared_core_browser.py /tmp/glyphspace-r183-disposable/qa_shared_core_browser.py
          printf '<!doctype html><meta charset="utf-8"><title>R183 disposable</title>' > /tmp/glyphspace-r183-disposable/index.html
          python /tmp/glyphspace-r183-disposable/qa_shared_core_browser.py
      - name: R184 non-idempotent fault branch regression (Node private Map)
        run: node scripts/r184_fault_branch_regression.mjs --no-write
      - name: Upload actual browser QA JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r183-real-same-origin-shared-core
          path: /tmp/glyphspace-r183-disposable/R183_shared_core_browser_QA.json
          if-no-files-found: warn
