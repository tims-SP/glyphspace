name: Repository integrity (static only)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-static-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen HTML, source WBS, key matrix, SHA256 and links
        run: python3 scripts/verify_repo.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: R152 isolated T04 raw source binding regression (not formal acceptance)
        run: node scripts/qa_v036_t04_r152_source_bound.mjs
