name: R239 T04 real same-origin concurrent recovery
on:
  push:
    branches: [main]
    paths:
      - 'scripts/r239_cross_tab_real_browser.py'
      - '.github/workflows/r239-t04-real-cross-tab.yml'
  workflow_dispatch:
jobs:
  real-cross-tab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run real cross-tab recovery QA
        run: |
          mkdir -p /tmp/glyphspace-r239
          cp scripts/v036_r148_strict_shadow.js scripts/v036_r152_source_bound_plan.js scripts/r194_r178_freshness.js scripts/r194_r179_realm.js scripts/r194_frozen_root_coords.json scripts/r194_real_issuer_r192_bridge.mjs scripts/r192_idempotent_freshness_core.mjs scripts/r239_cross_tab_real_browser.py /tmp/glyphspace-r239/
          printf '<!doctype html><meta charset="utf-8"><title>R239 isolated</title>' > /tmp/glyphspace-r239/index.html
          python /tmp/glyphspace-r239/r239_cross_tab_real_browser.py
      - name: Upload real browser QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r239-real-cross-tab
          path: /tmp/glyphspace-r239/R239_real_browser_QA.json
          if-no-files-found: warn
